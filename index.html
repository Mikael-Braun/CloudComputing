<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboTaxi App - Autenticação</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #0284c7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>RoboTaxi App</h2>
  
  <!-- Formulário de Autenticação -->
  <div id="auth-container">
    <h3 id="form-title">Iniciar Sessão</h3>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="password" placeholder="Palavra-passe" required>
    <button id="btn-login" onclick="login()">Entrar</button>
    <button id="btn-signup" onclick="signup()">Criar Conta (Passageiro)</button>
    <p id="auth-error" style="color: red;"></p>
  </div>

  <!-- Área Protegida (Após Login) -->
  <div id="user-container" class="hidden">
    <h3>Bem-vindo ao RoboTaxi!</h3>
    <p>Sessão iniciada como: <b id="user-email"></b></p>
    <button onclick="logout()">Sair</button>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Credenciais
    const firebaseConfig = {
      apiKey: "AIzaSyCb6aOBLBmDhQwf-isNMu1mYI2kCRwrj1U",
      authDomain: "cn-robottaxi.firebaseapp.com",
      projectId: "cn-robottaxi",
      storageBucket: "cn-robottaxi.firebasestorage.app",
      messagingSenderId: "127042854854",
      appId: "1:127042854854:web:2f75f78b9839bac3d0dcc7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Monitorizar Estado da Autenticação
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth-container").classList.add("hidden");
        document.getElementById("user-container").classList.remove("hidden");
        document.getElementById("user-email").innerText = user.email;
      } else {
        document.getElementById("auth-container").classList.remove("hidden");
        document.getElementById("user-container").classList.add("hidden");
      }
    });

    // Funções Globais para os Botões
    window.login = () => {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, pass).catch(err => {
        document.getElementById("auth-error").innerText = err.message;
      });
    };

    window.signup = () => {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      createUserWithEmailAndPassword(auth, email, pass).catch(err => {
        document.getElementById("auth-error").innerText = err.message;
      });
    };

    window.logout = () => signOut(auth);
  </script>
</body>
</html>
