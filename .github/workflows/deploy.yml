name: Testar regras e publicar no Firebase

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4   # o emulador do Firestore precisa de Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # Só publica em push para main e se os testes das regras passarem.
      - name: Deploy (Hosting + Firestore Rules)
        if: github.event_name == 'push'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only hosting,firestore:rules --project cn-robottaxi --non-interactive
